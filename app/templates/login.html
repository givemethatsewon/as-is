<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 · As-Is</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="brand-mark">AS</div>
      <p class="eyebrow">원상태 수출 관리</p>
      <h1>공용 계정 로그인</h1>
      <p>담당자에게 전달받은 공용 계정으로 접속하세요.</p>
      {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/login" class="stack-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next }}">
        <label>아이디<input name="username" autocomplete="username" required autofocus></label>
        <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit">로그인</button>
      </form>
    </main>
  </body>
</html>
