{% extends "base.html" %}
{% block title %}대시보드 · As-Is{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">엑셀 매칭</p>
    <h1>Stock 차감</h1>
    <p class="supporting-copy">수입/수출 엑셀을 넣고 차감 결과를 받습니다.</p>
  </div>
</section>

<section class="simple-workbench" aria-label="주요 작업">
  <a class="workbench-action primary" href="/upload">
    <span class="step-number">1</span>
    <span>
      <strong>엑셀 파일 넣기</strong>
      <small>수입 Stock 파일과 수출 파일을 업로드합니다.</small>
    </span>
  </a>
  <a class="workbench-action" href="/exports">
    <span class="step-number">2</span>
    <span>
      <strong>매칭 실행</strong>
      <small>Part Number, 원산지, FIFO 기준으로 차감합니다.</small>
    </span>
  </a>
  <a class="workbench-action" href="/reports">
    <span class="step-number">3</span>
    <span>
      <strong>결과 다운로드</strong>
      <small>차감 결과와 NO MATCH 내역을 엑셀로 받습니다.</small>
    </span>
  </a>
</section>

{% endblock %}
