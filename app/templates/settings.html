{% extends "base.html" %}
{% block title %}설정 · As-Is{% endblock %}
{% block content %}
<section class="page-head">
  <div><p class="eyebrow">설정</p><h1>매칭 정책</h1><p class="supporting-copy">변경한 기간은 다음 수출 파일부터 적용됩니다.</p></div>
</section>
{% if message %}<div class="notice success">{{ message }}</div>{% endif %}
{% if error %}<div class="notice error">{{ error }}</div>{% endif %}
<section class="panel narrow-panel">
  <form method="post" action="/settings" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
    <label>수입 인정 기간(일)<input type="number" name="eligibility_days" min="0" max="3650" value="{{ eligibility_days }}" required></label>
    <p class="field-help">기본값은 720일이며 시작일과 종료일을 포함합니다.</p>
    <button class="button primary" type="submit">설정 저장</button>
  </form>
</section>
{% endblock %}
