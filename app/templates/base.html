<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}As-Is{% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v=20260630-3">
    <script src="{{ url_for('static', path='/app.js') }}?v=20260630-3" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/dashboard">
        <span class="brand-mark">AS</span>
        <span>
          <strong>처음처럼 · 원상태 수출 관리</strong>
          <small>엑셀 Stock 매칭</small>
        </span>
      </a>
      <nav class="nav">
        <a class="{{ 'active' if active == 'dashboard' else '' }}" href="/dashboard">처음</a>
        <a class="{{ 'active' if active == 'upload' else '' }}" href="/upload">파일 업로드</a>
        <a class="{{ 'active' if active == 'exports' else '' }}" href="/exports">매칭</a>
        <a class="{{ 'active' if active == 'reports' else '' }}" href="/reports">결과</a>
      </nav>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
