<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}As-Is{% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/dashboard">
        <span class="brand-mark">AS</span>
        <span>
          <strong>처음처럼 · 원상태 수출 관리</strong>
          <small>수입 재고와 수출 요청을 연결해 환급 근거를 정리합니다</small>
        </span>
      </a>
      <nav class="nav">
        <a class="{{ 'active' if active == 'dashboard' else '' }}" href="/dashboard">대시보드</a>
        <a class="{{ 'active' if active == 'upload' else '' }}" href="/upload">파일 검토</a>
        <a class="{{ 'active' if active == 'inventory' else '' }}" href="/inventory">수입 재고</a>
        <a class="{{ 'active' if active == 'exports' else '' }}" href="/exports">수출 매칭</a>
        <a class="{{ 'active' if active == 'reports' else '' }}" href="/reports">다운로드</a>
      </nav>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
